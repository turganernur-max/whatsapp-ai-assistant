<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f7a5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI WhatsApp">
  <meta name="robots" content="noindex, nofollow">
  <title>AI WhatsApp Assistant</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="login" class="login hidden">
    <form id="login-form" class="card login-card">
      <div class="logo">🤖💬</div>
      <h1>AI-помощник WhatsApp</h1>
      <p class="muted">Вход в панель управления</p>
      <input id="login-password" type="password" autocomplete="current-password" placeholder="Пароль" required>
      <button class="btn primary wide" type="submit">Войти</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="topbar-title" id="page-title">Диалоги</div>
      <label class="ai-switch" title="Включить или выключить AI">
        <span id="ai-label">AI</span>
        <input type="checkbox" id="ai-toggle">
        <span class="slider"></span>
      </label>
    </header>
    <main id="view"></main>
    <nav class="tabbar">
      <a href="#chats" data-tab="chats"><span class="ico">💬</span><span>Диалоги</span><b id="badge" class="badge hidden"></b></a>
      <a href="#instructions" data-tab="instructions"><span class="ico">📝</span><span>Инструкции</span></a>
      <a href="#orders" data-tab="orders"><span class="ico">📦</span><span>Заказы</span><b id="badge-orders" class="badge hidden"></b></a>
      <a href="#kb" data-tab="kb"><span class="ico">📚</span><span>Знания</span></a>
      <a href="#stats" data-tab="stats"><span class="ico">📊</span><span>Отчёты</span></a>
      <a href="#settings" data-tab="settings"><span class="ico">⚙️</span><span>Настройки</span></a>
    </nav>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
